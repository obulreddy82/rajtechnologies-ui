<header class="site-header">
  <div class="header-inner">
    <a routerLink="/" class="brand" (click)="closeMenu()" aria-label="Raj Technologies home">
      <span class="logo-mark" aria-hidden="true">
        <span class="logo-rt">RT</span>
      </span>
      <span class="brand-copy">
        <span class="brand-name">Raj Technologies</span>
        <span class="brand-tag">Consultancy &amp; Solutions</span>
      </span>
    </a>

    <button
      type="button"
      class="menu-toggle"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="primary-nav"
      (click)="toggleMenu()">
      <span class="sr-only">Menu</span>
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>

    <nav
      id="primary-nav"
      class="nav"
      [class.open]="menuOpen()"
      >
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()">Home</a>
      <a
        routerLink="/employee-list"
        routerLinkActive="active"
        (click)="closeMenu()">Employees</a>
      <div class="nav-group">
        <span class="nav-group-label">Consultancy</span>
        <div class="nav-submenu" role="menu" aria-label="Consultancy menu">
          <a
            routerLink="/consultancy-upload"
            routerLinkActive="active"
            role="menuitem"
          >Upload</a>
          <a
            routerLink="/consultancy-list"
            routerLinkActive="active"
            role="menuitem"
          >Consultancy List</a>
          <a
            routerLink="/consultancy-add"
            routerLinkActive="active"
            role="menuitem"
          >Add consultancy info</a>
        </div>
      </div>
      <a routerLink="/about-us" routerLinkActive="active" (click)="closeMenu()">About Us</a>
      <a routerLink="/contact-us" routerLinkActive="active" (click)="closeMenu()">Contact Us</a>

      <span class="nav-divider" aria-hidden="true"></span>

      @if (auth.isLoggedIn()) {
        <a routerLink="/profile" routerLinkActive="active" (click)="closeMenu()">My Profile</a>
        <a routerLink="/sign-out" class="btn-outline" (click)="closeMenu()">Sign Out</a>
      } @else {
        <a routerLink="/sign-up" routerLinkActive="active" (click)="closeMenu()">Sign Up</a>
        <a routerLink="/sign-in" class="btn-primary" routerLinkActive="active" (click)="closeMenu()">Sign In</a>
      }
    </nav>
  </div>
</header>
