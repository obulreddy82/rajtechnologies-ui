<header>
  <div>
    <div class="logo"></div>
    <div class="cname"><h2>Raj Technologies</h2></div>
    <div class="menu">
      <nav>

        <a routerLink="/employee-list">Employees</a>
        <a routerLink="/about-us">About Us</a>

      </nav>
    </div>

</header>
